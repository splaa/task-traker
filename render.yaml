services:
  - type: web
    name: task-traker
    region: frankfurt
    plan: free
    buildCommand: composer install --no-dev --optimize-autoloader
    startCommand: vendor/bin/heroku-php-apache2 public/
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: LOG_CHANNEL
        value: errorlog
      - key: DB_CONNECTION
        fromDatabase:
          name: task-traker-db
          property: connection
      - key: DB_HOST
        fromDatabase:
          name: task-traker-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: task-traker-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: task-traker-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: task-traker-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: task-traker-db
          property: password

databases:
  - name: task-traker-db
    plan: free
    region: frankfurt
    databaseName: task_traker
    postgresMajorVersion: 16
