name: Dependency security and compatibility

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.5']
        database: [sqlite, mysql]
    services:
      mysql:
        image: ${{ matrix.database == 'mysql' && 'mysql:8.0' || '' }}
        env:
          MYSQL_ROOT_PASSWORD: test-root-password
          MYSQL_DATABASE: task_traker_test
          MYSQL_USER: task_traker_test
          MYSQL_PASSWORD: test-password
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptest-root-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, pdo_mysql
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: composer audit --locked
      - run: cp .env.example .env && php artisan key:generate
      - name: Test on ${{ matrix.database }}
        run: vendor/bin/phpunit ${{ matrix.database == 'mysql' && '--fail-on-skipped' || '' }}
        env:
          DB_CONNECTION: ${{ matrix.database }}
          DB_DATABASE: ${{ matrix.database == 'mysql' && 'task_traker_test' || ':memory:' }}
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ job.services.mysql.ports[3306] || '1' }}
          DB_USERNAME: task_traker_test
          DB_PASSWORD: test-password
          DB_SOCKET: ''
          DATABASE_URL: ''

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run test:security
      - run: npm run production
